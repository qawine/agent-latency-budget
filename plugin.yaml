name: agent-latency-budget
version: 0.1.0
description: "Track per-session tool latency and fail fast when a tool exceeds a configurable budget. Adds latency_budget_check and latency_budget_report tools + a post_tool_call hook."
author: qawine
kind: standalone
provides_tools:
  - latency_budget_check
  - latency_budget_report
provides_hooks:
  - pre_tool_call
  - post_tool_call
